# coturn for WarpDrop (optional: only needed when peers sit behind NATs that block direct WebRTC).
# Everything secret or host-specific (static-auth-secret, realm, external-ip) is injected by docker-compose.yml.
# The WarpDrop server mints short-lived credentials from the same secret, so there are no static users.

listening-port=3478
min-port=49160
max-port=49200

# time-limited REST credentials (username = expiry:random, password = HMAC-SHA1 of it)
use-auth-secret
fingerprint
no-cli
no-software-attribute
no-multicast-peers

# TLS/DTLS are off by default because they need certificates. See DEPLOY.md to enable turns: on 5349.
no-tls
no-dtls

# The relay must never reach the host's own network (SSRF): refuse every private, loopback and link-local peer.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# quotas: this is a file-transfer helper, not a public relay.
# total-quota caps concurrent allocations; max-bps caps one session (12.5 MB/s = 100 Mbit/s).
# Do NOT set bps-capacity: coturn reserves max-bps per session against it, so a small value silently limits you
# to bps-capacity / max-bps concurrent sessions and rejects the rest with "486 Allocation Bandwidth Quota Reached".
total-quota=100
user-quota=12
max-bps=12500000
