# WarpDrop: one container serves the web app, signaling and the encrypted relay.
# Put your own Caddy/Nginx in front (see deploy/); nothing here binds a public port.
#
#   docker compose up -d                  # the app
#   docker compose --profile turn up -d   # also run coturn (optional, see DEPLOY.md)

services:
  warpdrop:
    image: ghcr.io/biohazard786/warpdrop:${WARPDROP_VERSION:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      # encrypted WebSocket relay used when a direct connection fails; "off" disables it
      RELAY: ${RELAY:-on}
      RELAY_MAX_MBPS: ${RELAY_MAX_MBPS:-0}
      RELAY_MAX_CONNS: ${RELAY_MAX_CONNS:-200}
      # extra browser origins allowed to open /ws (same host is always allowed)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # peers whose X-Forwarded-For is trusted: loopback plus Docker's bridge ranges, where a host proxy appears from
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,172.16.0.0/12}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      # TURN is used only when BOTH of these are set
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      # Android app: signing-cert SHA-256(s) so share links open the app (served at /.well-known/assetlinks.json)
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-com.biohazard786.warpdrop}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Optional TURN relay. Needs TURN_SECRET (the same value the app uses), TURN_REALM (your domain) and
  # TURN_EXTERNAL_IP (the server's public IP). Host networking is required for the UDP relay port range.
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.7.0
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    volumes:
      - ./deploy/turnserver.conf:/etc/turnserver.static.conf:ro
    # The secret goes into a generated config rather than argv, so it never shows up in `ps`.
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -n "$$TURN_SECRET" ] || { echo "TURN_SECRET must be set to run coturn" >&2; exit 1; }
        [ -n "$$TURN_REALM" ] || { echo "TURN_REALM must be set to run coturn" >&2; exit 1; }
        [ -n "$$TURN_EXTERNAL_IP" ] || { echo "TURN_EXTERNAL_IP must be set to run coturn" >&2; exit 1; }
        cp /etc/turnserver.static.conf /tmp/turnserver.conf
        printf 'static-auth-secret=%s\nrealm=%s\nexternal-ip=%s\n' "$$TURN_SECRET" "$$TURN_REALM" "$$TURN_EXTERNAL_IP" >> /tmp/turnserver.conf
        exec turnserver -c /tmp/turnserver.conf --log-file=stdout
