name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
        working-directory: backend
      - run: go test -race -count=1 ./...
        working-directory: backend

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            backend/go.sum
      - run: go vet ./...
        working-directory: cli
      # the integration tests build and start ../backend, so this also covers the real server
      - run: go test -race -count=1 ./...
        working-directory: cli

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7 # the relay integration test builds the Go server
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run lint
        working-directory: web
      - run: bun run fmt:check
        working-directory: web
      - run: bun x tsc -b
        working-directory: web
      - run: bun x vitest run
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - run: bun install --frozen-lockfile
        working-directory: e2e
      - run: bun x playwright install --with-deps chromium firefox
        working-directory: e2e
      - run: bun x playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: SDK platform and NDK (the NDK builds the Go core)
        run: sdkmanager "platforms;android-37.2" "ndk;30.0.16248370"
      - run: go install golang.org/x/mobile/cmd/gomobile@latest
      - name: Build the Go core (apps/android/app/libs/warpcore.aar)
        run: make core NDK="$ANDROID_HOME/ndk/30.0.16248370"
        working-directory: apps/android
      - uses: gradle/actions/setup-gradle@v5
        with:
          # the wrapper is checked into apps/android/, not the repository root
          build-root-directory: apps/android
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
        working-directory: apps/android

  shell-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck install.sh
        run: shellcheck -S warning web/public/install.sh
      - name: compose files are valid
        run: |
          docker compose config -q
          docker compose --profile turn config -q
      - name: image builds
        run: docker build -t warpdrop:ci .
